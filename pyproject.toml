[project]
name = "rag-approaches"
version = "0.1.0"
description = "DIY RAG vs. Amazon Bedrock Knowledge Bases vs. agentic RAG on Amazon Bedrock AgentCore - a reproducible comparison."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.40",  # [crt] is required for `aws login` credentials
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "langgraph>=0.6",
    "langchain-aws>=0.2.30",
    "bedrock-agentcore>=0.1.5",
    "streamlit>=1.40",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.scripts]
rag = "rag_approaches.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_approaches"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 110
